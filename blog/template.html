<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOUR TITLE</title>
  <meta content="" name="keywords" />
  <meta content="" name="description" />
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:image" content="/images/blogs/" />
  <meta property='article:author' content='https://manojsatishkumar.com/' />
  <meta property='article:publisher' content='https://manojsatishkumar.com/' />
  <meta property='og:site_name' content='manojsatishkumar.com' />
  <meta property='og:type' content='article' />
  
  <link href="/css/style.css" rel="stylesheet" />
  <link href="/css/responsive.css" rel="stylesheet" />
  <!-- Favicon -->
  <link rel="shortcut icon" href="/images/favicon.png" />
  <style>
    .article-feed-ad {
      padding: 20px
    }

    .vertical-ad-banner {
      padding: 20px
    }

    /* Desktop */
    @media only screen and (min-width: 1024px) {}

    /* mobile */
    @media only screen and (max-width: 1024px) {
      .vertical-ad-banner {
        display: none;
      }

      #all-articles-list {
        display: none;
      }
    }
  </style>
  <style>
    /* Dark theme overrides (theme set by /js/theme.js) */
    html[data-theme="dark"] #blog h2,
    html[data-theme="dark"] #blog h4 {
      color: var(--dm-heading);
    }

    html[data-theme="dark"] #blog .journal-block a {
      color: var(--dm-accent);
    }

    html[data-theme="dark"] #blog .journal-block a:hover {
      color: var(--dm-accent-strong);
    }

    html[data-theme="dark"] #blog pem[style*="color: black"] {
      color: var(--dm-text) !important;
    }

    html[data-theme="dark"] hr {
      border-top-color: var(--dm-border);
    }

    /* Side list injected from /blog/all-articles-list.html */
    html[data-theme="dark"] #all-articles-side-list a[style*="color: black"] {
      color: var(--dm-text) !important;
    }

    html[data-theme="dark"] #all-articles-side-list a[style*="color: black"]:hover {
      color: var(--dm-accent-strong) !important;
    }

    html[data-theme="dark"] #all-articles-side-list img[style*="solid gray"] {
      border-color: var(--dm-border-strong) !important;
    }

    /* Article grid injected from /blog/all-articles.html */
    html[data-theme="dark"] #all-articles-list .blog-container {
      background: var(--dm-bg-alt);
    }

    html[data-theme="dark"] #all-articles-list [style*="-webkit-background-clip: text"] {
      background-image: var(--dm-heading-gradient) !important;
    }

    html[data-theme="dark"] #all-articles-list .blog-card {
      background: var(--dm-surface);
      border: 1px solid var(--dm-border);
      color: var(--dm-text);
      box-shadow: var(--dm-shadow);
    }

    html[data-theme="dark"] #all-articles-list .blog-card:hover {
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
    }

    html[data-theme="dark"] #all-articles-list .text-content h5 {
      color: var(--dm-heading);
    }
  </style>
  <script src="/js/theme.js"></script>
  <link href="/css/dark-mode.css" rel="stylesheet" />
</head>

<body>
  <div id="blog" class="text-left">
    <div style="margin-bottom: 100px;" id="desktop-nav-bar">
    </div>
    <div class="container ">
      <div class="journal-block">
        <div class="row">
          <div class="col-lg-9 col-md-8">
            <h2>
              YOUR TITLE
            </h2>
            <div style="margin-top: 10px;">Written by <a href="/">Manoj
                Satishkumar</a></div>
            <img style="width: 100%; margin-top: 20px;  margin-bottom: 30px; " src="/images/blogs/.jpg" />
            <div class="row ">
              <div class="container">
                <pem class=" " style="font-size: large; color: black">
                  <h4>Dear reader,</h3>
                    <br />
                    YOUR BODY
              </div>
              </pem>
            </div>
          </div>
          <div class="col-lg-3 col-md-4 ">
            
            <br />
            <br />
            <div id="all-articles-side-list">
            </div>
            <br />
            <br />
            
          </div>
        </div>
      </div>
    </div>
  </div>
  <hr />
  <br />
  <div id="all-articles-list"></div>
  <div style="margin: 0px; padding: 0px;" id="footer">
  </div>
  <link href="/lib/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
  <script src="/lib/jquery/jquery.min.js"></script>
  <script src="/lib/jquery/jquery-migrate.min.js"></script>
  <script src="/lib/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/lib/typed/typed.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('contextmenu', event => event.preventDefault());
  </script>
  <script>
    $(function () {
      $("#all-articles-list").load("/blog/all-articles.html");
      $("#all-articles-side-list").load("/blog/all-articles-list.html");
    });
  </script>
</body>

</html>
