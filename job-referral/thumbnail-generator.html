<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Job Referral Thumbnail Generator</title>
    <!--
      Social share card for /job-referral/ at the standard 1200x630 OG size.
      Regenerate with:  node job-referral/generate-thumbnail.js
      Output:           images/job-referral/thumbnail.jpg
      Icons are inline SVG on purpose, so rendering never depends on an icon font.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #dfe5f2;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .thumbnail {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(
            ellipse 55% 70% at 88% 6%,
            rgba(160, 108, 255, 0.28),
            transparent 68%
          ),
          radial-gradient(
            ellipse 60% 65% at 4% 96%,
            rgba(108, 131, 255, 0.24),
            transparent 66%
          ),
          radial-gradient(
            ellipse 40% 50% at 60% 100%,
            rgba(255, 168, 140, 0.18),
            transparent 70%
          ),
          linear-gradient(158deg, #fbfcff 0%, #f4f7ff 52%, #fdf6f1 100%);
      }

      /* Faint dot lattice for texture */
      .lattice {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
          rgba(81, 100, 216, 0.13) 1.5px,
          transparent 1.5px
        );
        background-size: 26px 26px;
        mask-image: linear-gradient(
          115deg,
          rgba(0, 0, 0, 0.55),
          transparent 62%
        );
        -webkit-mask-image: linear-gradient(
          115deg,
          rgba(0, 0, 0, 0.55),
          transparent 62%
        );
      }

      /* Gradient rule pinned to the top edge, echoing the page CTA card */
      .top-rule {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 7px;
        background: linear-gradient(
          to right,
          #6c83ff 0%,
          #a06cff 42%,
          #ff8fa3 74%,
          #ffb27a 100%
        );
      }

      .content {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 54px;
        height: 100%;
        padding: 62px 64px 58px;
      }

      /* ---------- Left column ---------- */
      .copy {
        flex: 1 1 auto;
        min-width: 0;
      }

      .kicker {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        padding: 11px 19px;
        border-radius: 999px;
        background: rgba(108, 131, 255, 0.13);
        border: 1.5px solid rgba(108, 131, 255, 0.32);
        color: #4655cc;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .kicker svg {
        width: 19px;
        height: 19px;
        stroke: #4655cc;
        stroke-width: 2.4;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .headline {
        margin: 26px 0 0;
        max-width: 660px;
        font-size: 65px;
        font-weight: 900;
        line-height: 1.03;
        letter-spacing: -0.035em;
        /* Mostly vertical so the colour progresses down the lines instead of
           restarting on each one */
        background: linear-gradient(158deg, #121fcf 4%, #7d1aa8 52%, #cf1512 96%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .subhead {
        margin: 22px 0 0;
        max-width: 640px;
        color: #55638a;
        font-size: 23px;
        font-weight: 500;
        line-height: 1.45;
      }

      .facts {
        display: flex;
        flex-wrap: wrap;
        gap: 11px;
        margin-top: 34px;
      }

      .fact {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.94);
        border: 1.5px solid rgba(196, 209, 240, 0.95);
        box-shadow: 0 6px 16px rgba(84, 102, 160, 0.1);
        color: #34405f;
        font-size: 18px;
        font-weight: 700;
      }

      .fact svg {
        width: 19px;
        height: 19px;
        stroke: #5164d8;
        stroke-width: 2.4;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ---------- Right column ---------- */
      .portrait {
        position: relative;
        flex: 0 0 316px;
        width: 316px;
      }

      .portrait::before {
        content: "";
        position: absolute;
        inset: -13% -11% 4%;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(160, 108, 255, 0.32),
          rgba(108, 131, 255, 0.16) 54%,
          transparent 72%
        );
      }

      .frame {
        position: relative;
        padding: 9px;
        border-radius: 40px;
        background: linear-gradient(
          150deg,
          #6c83ff 0%,
          #a06cff 48%,
          #ff8fa3 100%
        );
        box-shadow:
          0 30px 62px rgba(84, 102, 160, 0.3),
          0 10px 22px rgba(84, 102, 160, 0.16);
      }

      .frame img {
        display: block;
        width: 100%;
        height: 298px;
        object-fit: cover;
        object-position: center 18%;
        border-radius: 32px;
        background: #eef2fb;
      }

      .plate {
        position: relative;
        margin: -34px 14px 0;
        padding: 15px 20px;
        border-radius: 22px;
        background: #fff;
        border: 1.5px solid rgba(196, 209, 240, 0.9);
        box-shadow: 0 20px 42px rgba(84, 102, 160, 0.26);
      }

      .plate-label {
        display: block;
        margin-bottom: 4px;
        color: #8592ad;
        font-size: 11.5px;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .plate-name {
        display: block;
        color: #17213c;
        font-size: 21px;
        font-weight: 800;
        line-height: 1.16;
      }

      .plate-role {
        display: block;
        margin-top: 3px;
        color: #5f6d89;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.35;
      }

      /* ---------- Footer strip ---------- */
      .footer {
        position: absolute;
        bottom: 26px;
        left: 64px;
        right: 64px;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .url {
        display: flex;
        align-items: center;
        gap: 11px;
        color: #6b7899;
        font-size: 17px;
        font-weight: 600;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(135deg, #6c83ff, #a06cff);
        color: #fff;
        font-size: 12.5px;
        font-weight: 900;
        letter-spacing: 0.02em;
      }

      .url-text {
        color: #4d5a7d;
      }

      .url-path {
        color: #5164d8;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div class="thumbnail">
      <div class="lattice"></div>
      <div class="top-rule"></div>

      <div class="content">
        <div class="copy">
          <span class="kicker">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16.5 20.5v-1.6a3.6 3.6 0 0 0-3.6-3.6H5.9a3.6 3.6 0 0 0-3.6 3.6v1.6" />
              <circle cx="9.4" cy="7.9" r="3.6" />
              <path d="M21.7 20.5v-1.6a3.6 3.6 0 0 0-2.7-3.5" />
              <path d="M15.4 4.5a3.6 3.6 0 0 1 0 6.9" />
            </svg>
            Job Referral
          </span>

          <h1 class="headline">A referral is me putting my name next to yours</h1>

          <p class="subhead">
            What a referral really does, and how to ask for one.
          </p>

          <div class="facts">
            <span class="fact">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9.5" />
                <path d="m8 12.5 2.6 2.6L16 9.5" />
              </svg>
              Always free
            </span>
            <span class="fact">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="2.5" y="4.5" width="19" height="15" rx="2.5" />
                <path d="m21 7-9 5.5L3 7" />
              </svg>
              Email only
            </span>
            <span class="fact">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9.5 6.5h11M9.5 12h11M9.5 17.5h11" />
                <path d="m3 6.2 1.6 1.6L7.4 5" />
                <path d="m3 11.7 1.6 1.6L7.4 10.5" />
                <path d="m3 17.2 1.6 1.6L7.4 16" />
              </svg>
              5-point checklist
            </span>
          </div>
        </div>

        <div class="portrait">
          <div class="frame">
            <img src="../images/me_square.png" alt="Manoj Satishkumar" />
          </div>
          <div class="plate">
            <span class="plate-label">Your referrer</span>
            <span class="plate-name">Manoj Satishkumar</span>
            <span class="plate-role">Software Architect, Disney</span>
          </div>
        </div>
      </div>

      <div class="footer">
        <span class="url">
          <span class="brand-mark">MSK</span>
          <span>
            <span class="url-text">manojsatishkumar.com</span
            ><span class="url-path">/job-referral</span>
          </span>
        </span>
      </div>
    </div>
  </body>
</html>
