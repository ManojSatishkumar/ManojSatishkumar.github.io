<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Poppins', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070a1a"/>
      <stop offset="0.55" stop-color="#121736"/>
      <stop offset="1" stop-color="#070d20"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRose" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f43f5e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7df1e" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f7df1e" stop-opacity="0"/>
    </radialGradient>
    <!-- the line warms from rejection (bottom) to offers (top) -->
    <linearGradient id="line" x1="0" y1="520" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="0.8" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="dest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="title" x1="60" y1="0" x2="330" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="0.35" stop-color="#fbbf24"/>
      <stop offset="0.65" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <ellipse cx="980" cy="150" rx="360" ry="240" fill="url(#glowViolet)"/>
  <ellipse cx="860" cy="560" rx="380" ry="200" fill="url(#glowRose)"/>
  <ellipse cx="90" cy="80" rx="260" ry="200" fill="url(#glowGold)"/>

  <!-- ===================== The interview line ===================== -->
  <path d="M610 500H1060A80 80 0 0 0 1060 340H660A80 80 0 0 1 660 180H1050" stroke="url(#line)" stroke-width="16" stroke-linecap="round" filter="url(#blur)" opacity="0.55"/>
  <path d="M610 500H1060A80 80 0 0 0 1060 340H660A80 80 0 0 1 660 180H1050" stroke="url(#line)" stroke-width="9" stroke-linecap="round"/>

  <!-- month of learning, inside the loop -->
  <g transform="translate(624,288)">
    <rect x="0" y="-15" width="262" height="28" rx="14" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.4"/>
    <path d="M22 -6a7 7 0 1 0 2 5" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
    <path d="M24 -9v5h-5" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="4" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="12" font-weight="700" letter-spacing="0.4" fill="#ddd6fe">a month learning the event loop</text>
  </g>

  <!-- stations: rejections -->
  <g stroke-width="4">
    <circle cx="650" cy="500" r="16" fill="#0b1224" stroke="#fb7185"/>
    <circle cx="860" cy="500" r="16" fill="#0b1224" stroke="#fb7185"/>
    <circle cx="800" cy="340" r="16" fill="#0b1224" stroke="#fb7185"/>
    <circle cx="1000" cy="340" r="16" fill="#0b1224" stroke="#fbbf24"/>
    <circle cx="730" cy="180" r="16" fill="#0b1224" stroke="#34d399"/>
    <circle cx="890" cy="180" r="16" fill="#0b1224" stroke="#34d399"/>
  </g>
  <g stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M644 494l12 12M656 494l-12 12" stroke="#fb7185"/>
    <path d="M854 494l12 12M866 494l-12 12" stroke="#fb7185"/>
    <path d="M794 334l12 12M806 334l-12 12" stroke="#fb7185"/>
    <path d="M994 333h12M994 347h12M996 333c0 5 8 5 8 7s-8 2-8 7M1004 333c0 5-8 5-8 7s8 2 8 7" stroke="#fbbf24" stroke-width="2"/>
    <path d="M723 180l5 5 9-9" stroke="#34d399"/>
    <path d="M883 180l5 5 9-9" stroke="#34d399"/>
  </g>

  <g text-anchor="middle">
    <text x="650" y="542" font-size="15" font-weight="700" fill="#ffffff">Startup</text>
    <text x="650" y="561" font-size="12.5" fill="#94a3b8">React &amp; Redux todo app</text>
    <text x="860" y="542" font-size="15" font-weight="700" fill="#ffffff">MakeMyTrip</text>
    <text x="860" y="561" font-size="12.5" fill="#94a3b8">&#8220;async rendering&#8221;</text>

    <text x="800" y="382" font-size="15" font-weight="700" fill="#ffffff">IQVIA</text>
    <text x="800" y="401" font-size="12.5" fill="#94a3b8">met &#8220;the beast&#8221;</text>
    <text x="1000" y="382" font-size="15" font-weight="700" fill="#ffffff">Oracle</text>
    <text x="1000" y="401" font-size="12.5" fill="#94a3b8">cleared&#8230; then silence</text>

    <text x="730" y="222" font-size="15" font-weight="700" fill="#ffffff">JP Morgan Chase</text>
    <text x="730" y="241" font-size="12.5" fill="#86efac">offer</text>
    <text x="890" y="222" font-size="15" font-weight="700" fill="#ffffff">Tesco</text>
    <text x="890" y="241" font-size="12.5" fill="#86efac">offer</text>
  </g>

  <!-- destination -->
  <circle cx="1068" cy="180" r="40" fill="url(#dest)" filter="url(#blur)" opacity="0.8"/>
  <circle cx="1068" cy="180" r="28" fill="url(#dest)"/>
  <circle cx="1068" cy="180" r="28" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
  <path d="M1068 164l4.7 9.6 10.5 1.5-7.6 7.4 1.8 10.5-9.4-5-9.4 5 1.8-10.5-7.6-7.4 10.5-1.5z" fill="#ffffff"/>
  <g filter="url(#soft)">
    <rect x="960" y="72" width="196" height="58" rx="16" fill="#f8fafc"/>
  </g>
  <text x="978" y="96" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.6" fill="#7c3aed">DESTINATION</text>
  <text x="978" y="118" font-size="16" font-weight="800" fill="#0f172a">Walmart Labs</text>
  <!-- ===================== Headline ===================== -->
  <rect x="64" y="60" width="52" height="52" rx="10" fill="#f7df1e"/>
  <text x="108" y="104" text-anchor="end" font-size="24" font-weight="800" fill="#111111">JS</text>
  <rect x="130" y="68" width="228" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#f7df1e" stroke-opacity="0.45"/>
  <text x="150" y="91" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#fef9c3">INTERVIEW STORY</text>

  <text x="58" y="210" font-size="60" font-weight="800" letter-spacing="-1.5" fill="#ffffff">My JavaScript</text>
  <text x="58" y="280" font-size="60" font-weight="800" letter-spacing="-1.5" fill="#ffffff">interview</text>
  <text x="58" y="350" font-size="60" font-weight="800" letter-spacing="-1.5" fill="url(#title)">journey</text>

  <text x="64" y="404" font-size="20" font-weight="500" fill="#cbd5e1">5 lessons from rejections,</text>
  <text x="64" y="432" font-size="20" font-weight="500" fill="#cbd5e1">waiting rooms and offers.</text>

  <g transform="translate(64,552)">
    <rect x="0" y="0" width="52" height="30" rx="15" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="26" y="20" font-size="13" font-weight="700" fill="#ffffff" fill-opacity="0.75" text-anchor="middle">MSK</text>
    <text x="66" y="20" font-size="15" font-weight="500" fill="#ffffff" fill-opacity="0.6">manojsatishkumar.com</text>
  </g>

  <rect width="1200" height="6" fill="url(#topbar)"/>
</svg>
