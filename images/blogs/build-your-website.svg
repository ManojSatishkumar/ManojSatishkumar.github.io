<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Poppins', 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#040d1a"/>
      <stop offset="0.5" stop-color="#0a2540"/>
      <stop offset="1" stop-color="#03101f"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hl" x1="75" y1="300" x2="620" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <ellipse cx="1050" cy="130" rx="470" ry="360" fill="url(#glowCyan)"/>
  <ellipse cx="120" cy="640" rx="420" ry="320" fill="url(#glowBlue)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#topbar)"/>

  <g fill="#ffffff" fill-opacity="0.35">
    <circle cx="1112" cy="56" r="4"/>
    <circle cx="1132" cy="56" r="4"/>
    <circle cx="1152" cy="56" r="4"/>
  </g>

  <!-- ===================== RIGHT VISUAL: browser mockup ===================== -->
  <g transform="translate(742,150)" filter="url(#soft)">
    <rect x="0" y="0" width="410" height="300" rx="18" fill="#0b1b30" stroke="#ffffff" stroke-opacity="0.14"/>
    <!-- title bar -->
    <rect x="0" y="0" width="410" height="42" rx="18" fill="#12233b"/>
    <rect x="0" y="24" width="410" height="18" fill="#12233b"/>
    <circle cx="26" cy="21" r="6" fill="#ff5f57"/>
    <circle cx="48" cy="21" r="6" fill="#febc2e"/>
    <circle cx="70" cy="21" r="6" fill="#28c840"/>
    <rect x="120" y="12" width="230" height="18" rx="9" fill="#ffffff" fill-opacity="0.08"/>
    <!-- content: sidebar avatar -->
    <circle cx="70" cy="110" r="30" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="70" cy="104" r="11" fill="#38bdf8" fill-opacity="0.9"/>
    <path d="M 52 130 a 18 15 0 0 1 36 0 Z" fill="#38bdf8" fill-opacity="0.9"/>
    <rect x="40" y="152" width="60" height="9" rx="4" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="40" y="168" width="42" height="8" rx="4" fill="#ffffff" fill-opacity="0.14"/>
    <!-- headline bars -->
    <rect x="130" y="72" width="230" height="16" rx="6" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="130" y="98" width="180" height="12" rx="6" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="130" y="118" width="205" height="12" rx="6" fill="#ffffff" fill-opacity="0.14"/>
    <!-- project cards -->
    <rect x="130" y="152" width="70" height="60" rx="10" fill="#38bdf8" fill-opacity="0.9"/>
    <rect x="210" y="152" width="70" height="60" rx="10" fill="#818cf8" fill-opacity="0.9"/>
    <rect x="290" y="152" width="70" height="60" rx="10" fill="#22d3ee" fill-opacity="0.9"/>
    <!-- footer line -->
    <rect x="40" y="240" width="320" height="10" rx="5" fill="#ffffff" fill-opacity="0.1"/>
  </g>

  <!-- floating tech badges -->
  <g filter="url(#soft)">
    <rect x="726" y="118" width="52" height="40" rx="10" fill="#e34f26"/>
    <text x="752" y="144" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">H5</text>
    <rect x="1080" y="404" width="60" height="40" rx="10" fill="#1572b6"/>
    <text x="1110" y="430" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">CSS</text>
    <rect x="700" y="410" width="52" height="40" rx="10" fill="#f7df1e"/>
    <text x="726" y="436" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">JS</text>
  </g>

  <!-- ===================== LEFT TEXT ===================== -->
  <g>
    <rect x="75" y="70" width="182" height="46" rx="23" fill="#ffffff" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.55"/>
    <circle cx="102" cy="93" r="6" fill="#38bdf8"/>
    <text x="120" y="99" font-size="18" font-weight="600" fill="#e0f2fe" letter-spacing="2">CAREER &#183; WEB</text>
  </g>

  <text x="77" y="176" font-size="17" font-weight="600" fill="#7dd3fc" letter-spacing="4">STEP-BY-STEP BUILD GUIDE</text>

  <text x="72" y="262" font-size="80" font-weight="700" fill="#ffffff" letter-spacing="-1">Build Your</text>
  <text x="72" y="352" font-size="80" font-weight="700" fill="url(#hl)" letter-spacing="-1">Portfolio</text>
  <text x="72" y="442" font-size="80" font-weight="700" fill="#ffffff" letter-spacing="-1">Website</text>

  <rect x="75" y="466" width="140" height="6" rx="3" fill="url(#hl)"/>

  <g>
    <rect x="75" y="500" width="140" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="145" y="526" font-size="16" font-weight="600" fill="#e0f2fe" text-anchor="middle">8 min read</text>

    <rect x="227" y="500" width="330" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="392" y="526" font-size="16" font-weight="500" fill="#bae6fd" text-anchor="middle">HTML &#183; CSS &#183; JS &#183; Deploy</text>
  </g>

  <g transform="translate(75,580)">
    <rect x="0" y="-2" width="52" height="30" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="26" y="19" font-size="14" font-weight="700" fill="#ffffff" fill-opacity="0.7" text-anchor="middle">MSK</text>
    <text x="66" y="19" font-size="15" font-weight="500" fill="#ffffff" fill-opacity="0.55">manojsatishkumar.com</text>
  </g>
</svg>
