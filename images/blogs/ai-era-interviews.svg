<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Poppins', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="0.55" stop-color="#121a3d"/>
      <stop offset="1" stop-color="#081022"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="980" cy="160" rx="420" ry="320" fill="url(#glowViolet)"/>
  <ellipse cx="160" cy="620" rx="420" ry="300" fill="url(#glowCyan)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#topbar)"/>

  <!-- ===================== LEFT: the classic round, fading out ===================== -->
  <g opacity="0.78">
    <rect x="60" y="140" width="420" height="350" rx="24" fill="#ffffff" fill-opacity="0.035" stroke="#cbd5e1" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="7 7"/>

    <text x="90" y="182" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.4" fill="#94a3b8">CLASSIC ROUND</text>

    <!-- stopwatch -->
    <circle cx="438" cy="176" r="15" stroke="#fbbf24" stroke-width="2.5"/>
    <rect x="433" y="155" width="10" height="5" rx="2" fill="#fbbf24"/>
    <path d="M438 176V167M438 176l6 4" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <text x="412" y="182" text-anchor="end" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="16" font-weight="700" fill="#fbbf24">45:00</text>

    <line x1="90" y1="206" x2="450" y2="206" stroke="#ffffff" stroke-opacity="0.1"/>

    <!-- whiteboard binary tree -->
    <g stroke="#a5b4fc" stroke-opacity="0.75" stroke-width="2" stroke-linecap="round">
      <path d="M270 266L205 326M270 266L335 326M205 326L170 390M205 326L240 390M335 326L300 390M335 326L370 390"/>
    </g>
    <g fill="#0b1224" stroke="#a5b4fc" stroke-width="2">
      <circle cx="270" cy="258" r="21"/>
      <circle cx="205" cy="326" r="19"/>
      <circle cx="335" cy="326" r="19"/>
      <circle cx="170" cy="392" r="17"/>
      <circle cx="240" cy="392" r="17"/>
      <circle cx="300" cy="392" r="17"/>
      <circle cx="370" cy="392" r="17"/>
    </g>
    <g font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">
      <text x="270" y="263">8</text>
      <text x="205" y="331">3</text>
      <text x="335" y="331">10</text>
      <text x="170" y="397">1</text>
      <text x="240" y="397">6</text>
      <text x="300" y="397">9</text>
      <text x="370" y="397">14</text>
    </g>

    <text x="90" y="458" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="15" fill="#94a3b8"><tspan fill="#67e8f9">invertTree</tspan>(root) <tspan fill="#64748b">// from memory, no AI</tspan></text>
  </g>

  <!-- ===================== The AI shift ===================== -->
  <path d="M492 316C556 316 584 248 652 244" stroke="url(#arrow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
  <path d="M648 232L668 243L648 256Z" fill="#a78bfa"/>
  <g filter="url(#soft)">
    <circle cx="566" cy="286" r="28" fill="url(#arrow)"/>
    <text x="566" y="292" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">AI</text>
  </g>
  <g fill="#f9a8d4">
    <path d="M604 254l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
    <path d="M532 322l2 4.5 4.5 2-4.5 2-2 4.5-2-4.5-4.5-2 4.5-2z" fill="#67e8f9"/>
  </g>

  <!-- ===================== RIGHT: AI editor ===================== -->
  <g filter="url(#soft)">
    <rect x="680" y="92" width="450" height="300" rx="20" fill="#0b1224" stroke="#ffffff" stroke-opacity="0.12"/>
    <path d="M680 112a20 20 0 0 1 20-20h410a20 20 0 0 1 20 20v28H680z" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="704" cy="116" r="6" fill="#f87171"/>
    <circle cx="724" cy="116" r="6" fill="#fbbf24"/>
    <circle cx="744" cy="116" r="6" fill="#34d399"/>
    <text x="905" y="121" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="13" fill="#94a3b8">SearchBox.jsx &#8212; AI generated</text>
  </g>

  <!-- highlighted line under review -->
  <rect x="690" y="235" width="430" height="24" rx="4" fill="#fbbf24" fill-opacity="0.12"/>
  <rect x="690" y="235" width="3" height="24" fill="#fbbf24"/>

  <!-- SVG collapses leading spaces, so indentation is an x offset (18px per level) -->
  <g font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="15">
    <g fill="#475569" text-anchor="end">
      <text x="716" y="176">1</text>
      <text x="716" y="202">2</text>
      <text x="716" y="228">3</text>
      <text x="716" y="252">4</text>
      <text x="716" y="278">5</text>
      <text x="716" y="304">6</text>
      <text x="716" y="330">7</text>
    </g>
    <text x="732" y="176"><tspan fill="#c084fc">function</tspan><tspan fill="#67e8f9"> SearchBox</tspan><tspan fill="#e2e8f0">({ onSearch }) {</tspan></text>
    <text x="750" y="202"><tspan fill="#c084fc">const</tspan><tspan fill="#e2e8f0"> [q, setQ] = </tspan><tspan fill="#67e8f9">useState</tspan><tspan fill="#fca5a5">("")</tspan><tspan fill="#e2e8f0">;</tspan></text>
    <text x="750" y="228"><tspan fill="#67e8f9">useEffect</tspan><tspan fill="#e2e8f0">(() =&gt; {</tspan></text>
    <text x="768" y="252"><tspan fill="#67e8f9">fetch</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#86efac">`/api/search?q=${q}`</tspan><tspan fill="#e2e8f0">)</tspan></text>
    <text x="786" y="278"><tspan fill="#e2e8f0">.</tspan><tspan fill="#67e8f9">then</tspan><tspan fill="#e2e8f0">(r =&gt; r.</tspan><tspan fill="#67e8f9">json</tspan><tspan fill="#e2e8f0">())</tspan></text>
    <text x="786" y="304"><tspan fill="#e2e8f0">.</tspan><tspan fill="#67e8f9">then</tspan><tspan fill="#e2e8f0">(onSearch);</tspan></text>
    <text x="750" y="330"><tspan fill="#e2e8f0">}, [q]);</tspan></text>
    <text x="750" y="366" font-size="14" font-style="italic" fill="#a78bfa" fill-opacity="0.85">&#10022; AI: add debounce + AbortController?</text>
  </g>

  <!-- ===================== Review comment ===================== -->
  <g filter="url(#soft)">
    <rect x="640" y="414" width="272" height="96" rx="16" fill="#151d36" stroke="#fbbf24" stroke-opacity="0.45"/>
    <circle cx="672" cy="446" r="16" fill="#fbbf24" fill-opacity="0.18"/>
    <text x="672" y="452" text-anchor="middle" font-size="16" font-weight="800" fill="#fbbf24">!</text>
    <text x="700" y="444" font-size="14" font-weight="700" fill="#fbbf24">Review &#183; line 4</text>
    <text x="700" y="468" font-size="13" fill="#e2e8f0">Stale responses can</text>
    <text x="700" y="488" font-size="13" fill="#e2e8f0">overwrite newer ones.</text>
  </g>

  <!-- ===================== Scorecard ===================== -->
  <g filter="url(#soft)" transform="translate(0,28)">
    <rect x="930" y="352" width="222" height="226" rx="18" fill="#f8fafc"/>
    <text x="952" y="386" font-size="11" font-weight="800" letter-spacing="1.8" fill="#64748b">INTERVIEW SIGNAL</text>
    <line x1="952" y1="400" x2="1130" y2="400" stroke="#e2e8f0"/>
    <g font-size="14" font-weight="600">
      <circle cx="962" cy="424" r="9" fill="#e2e8f0"/>
      <path d="M958 420l8 8M966 420l-8 8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <text x="980" y="429" fill="#94a3b8">Typing speed</text>
      <line x1="980" y1="424" x2="1072" y2="424" stroke="#94a3b8" stroke-width="1.5"/>

      <circle cx="962" cy="456" r="9" fill="#22c55e"/>
      <path d="M957.5 456l3 3 6-6" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="980" y="461" fill="#0f172a">Problem framing</text>

      <circle cx="962" cy="488" r="9" fill="#22c55e"/>
      <path d="M957.5 488l3 3 6-6" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="980" y="493" fill="#0f172a">Architecture</text>

      <circle cx="962" cy="520" r="9" fill="#22c55e"/>
      <path d="M957.5 520l3 3 6-6" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="980" y="525" fill="#0f172a">Code review</text>

      <circle cx="962" cy="552" r="9" fill="#8b5cf6"/>
      <path d="M957.5 552l3 3 6-6" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="980" y="557" fill="#0f172a">AI judgment</text>
    </g>
  </g>
</svg>
