<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Poppins', 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0920"/>
      <stop offset="0.5" stop-color="#231c56"/>
      <stop offset="1" stop-color="#0c0a26"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hl" x1="75" y1="300" x2="620" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <ellipse cx="1040" cy="120" rx="460" ry="360" fill="url(#glowViolet)"/>
  <ellipse cx="120" cy="640" rx="420" ry="320" fill="url(#glowIndigo)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#topbar)"/>

  <g fill="#ffffff" fill-opacity="0.35">
    <circle cx="1112" cy="56" r="4"/>
    <circle cx="1132" cy="56" r="4"/>
    <circle cx="1152" cy="56" r="4"/>
  </g>

  <!-- ===================== RIGHT VISUAL: recovery / comeback curve ===================== -->
  <g transform="translate(770,150)" filter="url(#soft)">
    <rect x="0" y="0" width="360" height="360" rx="28" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <line x1="34" y1="300" x2="326" y2="300" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>

    <!-- dip-then-recover path -->
    <polyline points="46,120 110,196 165,244 225,168 300,72" fill="none" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- low point (the PIP) -->
    <circle cx="165" cy="244" r="10" fill="#f87171"/>
    <circle cx="165" cy="244" r="18" fill="none" stroke="#f87171" stroke-opacity="0.4" stroke-width="2"/>
    <text x="165" y="292" font-size="15" font-weight="600" fill="#fca5a5" text-anchor="middle">PIP</text>
    <!-- arrowhead up -->
    <polygon points="300,72 277,78 296,96" fill="#c4b5fd"/>

    <!-- success flag / check badge -->
    <g transform="translate(300,58)">
      <circle r="30" fill="#22c55e"/>
      <circle r="30" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
      <path d="M -13 1 L -4 11 L 14 -10" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ===================== LEFT TEXT ===================== -->
  <g>
    <rect x="75" y="70" width="216" height="46" rx="23" fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.55"/>
    <circle cx="102" cy="93" r="6" fill="#a78bfa"/>
    <text x="120" y="99" font-size="18" font-weight="600" fill="#ede9fe" letter-spacing="2">CAREER · GROWTH</text>
  </g>

  <text x="77" y="176" font-size="17" font-weight="600" fill="#c4b5fd" letter-spacing="4">THE COMPLETE SURVIVAL GUIDE</text>

  <text x="72" y="262" font-size="80" font-weight="700" fill="#ffffff" letter-spacing="-1">What To Do</text>
  <text x="72" y="352" font-size="80" font-weight="700" fill="#ffffff" letter-spacing="-1">When Put</text>
  <text x="72" y="442" font-size="80" font-weight="700" fill="url(#hl)" letter-spacing="-1">On a PIP</text>

  <rect x="75" y="466" width="140" height="6" rx="3" fill="url(#hl)"/>

  <g>
    <rect x="75" y="500" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="150" y="526" font-size="16" font-weight="600" fill="#ede9fe" text-anchor="middle">12 min read</text>

    <rect x="237" y="500" width="360" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="417" y="526" font-size="16" font-weight="500" fill="#ddd6fe" text-anchor="middle">Assess · Plan · Deliver · Decide</text>
  </g>

  <g transform="translate(75,580)">
    <rect x="0" y="-2" width="52" height="30" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="26" y="19" font-size="14" font-weight="700" fill="#ffffff" fill-opacity="0.7" text-anchor="middle">MSK</text>
    <text x="66" y="19" font-size="15" font-weight="500" fill="#ffffff" fill-opacity="0.55">manojsatishkumar.com</text>
  </g>
</svg>
