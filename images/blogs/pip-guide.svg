<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Poppins', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a1f"/>
      <stop offset="0.55" stop-color="#17123a"/>
      <stop offset="1" stop-color="#0a1024"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRose" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f43f5e" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="60" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="980" cy="300" rx="420" ry="340" fill="url(#glowViolet)"/>
  <ellipse cx="200" cy="520" rx="360" ry="260" fill="url(#glowRose)"/>

  <!-- topographic contours: navigating the options -->
  <g stroke="#c4b5fd" stroke-opacity="0.07" stroke-width="1.5" transform="rotate(-12 960 320)">
    <ellipse cx="960" cy="320" rx="150" ry="90"/>
    <ellipse cx="960" cy="320" rx="240" ry="150"/>
    <ellipse cx="960" cy="320" rx="330" ry="210"/>
    <ellipse cx="960" cy="320" rx="420" ry="270"/>
    <ellipse cx="960" cy="320" rx="510" ry="330"/>
  </g>

  <!-- ===================== Title ===================== -->
  <rect x="64" y="52" width="176" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#fb7185" stroke-opacity="0.55"/>
  <circle cx="86" cy="70" r="5" fill="#fb7185"/>
  <text x="100" y="75" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#ffe4e6">CAREER &#183; PIP</text>

  <text x="60" y="146" font-size="48" font-weight="800" letter-spacing="-1.2" fill="#ffffff">What to do when</text>
  <text x="60" y="208" font-size="58" font-weight="800" letter-spacing="-1.5" fill="url(#title)">put on a PIP</text>

  <!-- ===================== The formal notice ===================== -->
  <g transform="rotate(-5 235 435)" filter="url(#soft)">
    <rect x="80" y="290" width="310" height="290" rx="16" fill="#f8fafc"/>
    <text x="104" y="324" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#64748b">PERFORMANCE IMPROVEMENT PLAN</text>
    <line x1="104" y1="338" x2="366" y2="338" stroke="#e2e8f0"/>
    <text x="104" y="368" font-size="20" font-weight="800" fill="#0f172a">Formal notice</text>

    <text x="104" y="398" font-size="12" font-weight="600" fill="#64748b">Areas to improve</text>
    <rect x="104" y="408" width="236" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="104" y="422" width="180" height="8" rx="4" fill="#e2e8f0"/>

    <text x="104" y="456" font-size="12" font-weight="600" fill="#64748b">Timeframe</text>
    <rect x="104" y="466" width="120" height="8" rx="4" fill="#c7d2fe"/>

    <text x="104" y="498" font-size="12" font-weight="600" fill="#64748b">If goals are not met</text>
    <rect x="104" y="508" width="206" height="8" rx="4" fill="#fecdd3"/>

    <path d="M108 548c10-14 18-14 20-2s8 10 16-6 14-8 14 2 10 6 22-4" stroke="#1e3a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="104" y1="556" x2="270" y2="556" stroke="#94a3b8" stroke-dasharray="4 4"/>
    <text x="104" y="572" font-size="11" font-weight="500" fill="#94a3b8">Employee signature</text>

    <g transform="rotate(14 332 362)">
      <rect x="284" y="344" width="96" height="36" rx="6" stroke="#e11d48" stroke-width="3" fill="#ffffff" fill-opacity="0.6"/>
      <text x="332" y="369" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="1.5" fill="#e11d48">ON PIP</text>
    </g>
  </g>

  <!-- ===================== Start: the 1:1 ===================== -->
  <path d="M396 432H452" stroke="#c4b5fd" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/>
  <text x="478" y="384" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#c4b5fd">START WITH A 1:1</text>

  <!-- ===================== Four paths ===================== -->
  <g stroke-linecap="round" fill="none">
    <path d="M500 432C620 432 610 138 740 138" stroke="#34d399" stroke-opacity="0.18" stroke-width="12"/>
    <path d="M500 432C620 432 610 256 740 256" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="12"/>
    <path d="M500 432C620 432 610 374 740 374" stroke="#a78bfa" stroke-opacity="0.18" stroke-width="12"/>
    <path d="M500 432C620 432 610 492 740 492" stroke="#fbbf24" stroke-opacity="0.22" stroke-width="12"/>
    <path d="M500 432C620 432 610 138 740 138" stroke="#34d399" stroke-width="3.5"/>
    <path d="M500 432C620 432 610 256 740 256" stroke="#38bdf8" stroke-width="3.5"/>
    <path d="M500 432C620 432 610 374 740 374" stroke="#a78bfa" stroke-width="3.5"/>
    <path d="M500 432C620 432 610 492 740 492" stroke="#fbbf24" stroke-width="3.5"/>
  </g>

  <g filter="url(#soft)">
    <circle cx="478" cy="432" r="26" fill="url(#node)"/>
    <text x="478" y="437" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="0.5" fill="#ffffff">YOU</text>
  </g>

  <!-- ===================== Option cards ===================== -->
  <g filter="url(#soft)">
    <rect x="740" y="96" width="410" height="84" rx="18" fill="#111a33" stroke="#34d399" stroke-opacity="0.55"/>
    <rect x="740" y="214" width="410" height="84" rx="18" fill="#111a33" stroke="#38bdf8" stroke-opacity="0.55"/>
    <rect x="740" y="332" width="410" height="84" rx="18" fill="#111a33" stroke="#a78bfa" stroke-opacity="0.55"/>
    <rect x="740" y="450" width="410" height="84" rx="18" fill="#1a1630" stroke="#fbbf24" stroke-opacity="0.9" stroke-width="2"/>
  </g>

  <g font-weight="800" font-size="16" text-anchor="middle" fill="#0b1224">
    <circle cx="776" cy="138" r="18" fill="#34d399"/><text x="776" y="144">1</text>
    <circle cx="776" cy="256" r="18" fill="#38bdf8"/><text x="776" y="262">2</text>
    <circle cx="776" cy="374" r="18" fill="#a78bfa"/><text x="776" y="380">3</text>
    <circle cx="776" cy="492" r="18" fill="#fbbf24"/><text x="776" y="498">4</text>
  </g>

  <g>
    <text x="808" y="133" font-size="20" font-weight="700" fill="#ffffff">Clear the PIP and stay</text>
    <text x="808" y="157" font-size="14" fill="#94a3b8">Work hard, stay at least 1 more year</text>

    <text x="808" y="251" font-size="20" font-weight="700" fill="#ffffff">Clear the PIP, then IJP</text>
    <text x="808" y="275" font-size="14" fill="#94a3b8">Find a better team internally</text>

    <text x="808" y="369" font-size="20" font-weight="700" fill="#ffffff">Clear the PIP, then switch</text>
    <text x="808" y="393" font-size="14" fill="#94a3b8">Use the time to prepare for outside</text>

    <text x="808" y="487" font-size="20" font-weight="700" fill="#ffffff">Resign and start searching</text>
    <text x="808" y="511" font-size="14" fill="#fde68a">If the PIP feels unfair</text>
  </g>

  <rect x="1012" y="438" width="126" height="24" rx="12" fill="#fbbf24"/>
  <text x="1075" y="454" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1" fill="#1c1917">&#9733; RECOMMENDED</text>

  <!-- Branding -->
  <g transform="translate(1150,568)" text-anchor="end">
    <text x="0" y="20" font-size="15" font-weight="500" fill="#ffffff" fill-opacity="0.6">manojsatishkumar.com</text>
    <rect x="-226" y="0" width="52" height="30" rx="15" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="-200" y="20" font-size="13" font-weight="700" fill="#ffffff" fill-opacity="0.75" text-anchor="middle">MSK</text>
  </g>

  <rect width="1200" height="6" fill="url(#topbar)"/>
</svg>
