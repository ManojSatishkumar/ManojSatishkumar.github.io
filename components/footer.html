      text-decoration: none;
      transition: color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }
    .site-footer__social a:hover {
      color: var(--sf-accent);
      border-color: var(--sf-accent);
      transform: translateY(-2px);
    }
    .site-footer__bottom {
